[project]
name = "retailpulse-ai"
version = "0.1.0"
description = "RetailPulse AI - retail demand forecasting copilot built on simulated real-time replay of UCI Online Retail II"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "holidays>=0.50",
    "python-dateutil>=2.8",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "confluent-kafka>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs external services (e.g. Kafka); skipped unless configured"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
