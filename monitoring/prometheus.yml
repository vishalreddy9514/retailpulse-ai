global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: retailpulse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: retailpulse-consumer
    static_configs:
      - targets: ["consumer:9101"]
