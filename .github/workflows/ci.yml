name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  kafka-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start Kafka
        run: |
          docker compose up -d --wait kafka
      - name: Replay integration tests
        env:
          RETAILPULSE_KAFKA_BOOTSTRAP: localhost:9092
        run: pytest -m integration tests/integration
      - name: Kafka logs on failure
        if: failure()
        run: docker compose logs kafka
