name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -W error

  kafka-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start Kafka
        run: docker compose up -d --wait kafka
      - name: Replay and stream integration tests
        env:
          RETAILPULSE_KAFKA_BOOTSTRAP: localhost:9092
        run: pytest -m integration tests/integration
      - name: Kafka logs on failure
        if: failure()
        run: docker compose logs kafka

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test stage (lint + unit tests inside the image)
        run: docker build --target test -t retailpulse:test .
      - name: Build runtime image
        run: docker build --target runtime -t retailpulse:ci .
      - name: Smoke test runtime image
        run: |
          docker run --rm retailpulse:ci sh -c 'id -un && python -c "import lightgbm, src.api.main, src.dashboard.api_client, src.streaming.kafka_consumer; print(\"ok\")"'
      - name: Validate compose file
        run: docker compose config -q
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m" -w /m \
            prom/prometheus:v3.5.0 test rules alerts_test.yml

  publish:
    # Continuous delivery: on main only, after every check passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, kafka-integration, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker build --target runtime -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
