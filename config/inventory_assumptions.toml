# SYNTHETIC INVENTORY ASSUMPTIONS
#
# UCI Online Retail II contains no stock levels, purchase orders or supplier lead times.
# Every inventory figure in RetailPulse is generated from the assumptions below. None of
# it is the retailer's real inventory. Change these values to explore other scenarios;
# every output records the assumptions it was produced with.

[generation]
seed = 20111208
# Current stock = uniform(cover_days_min, cover_days_max) trading days of recent mean demand.
cover_days_min = 0.0
cover_days_max = 30.0
# Products with no recent demand get uniform{0..zero_demand_stock_max} units.
zero_demand_stock_max = 20

[lead_time]
# Supplier lead time in trading days, drawn per product with these weights.
days = [3, 5, 7, 10, 14]
weights = [0.20, 0.35, 0.25, 0.15, 0.05]

[policy]
# Target probability of not running out during the lead time.
service_level = 0.95
# Trading days of history (up to the snapshot date) used for mean and std of daily demand.
demand_window_days = 56
# Order-up-to policy: an order covers lead time + review period, plus safety stock.
review_period_days = 7

[risk]
# Risk level from the probability of a stockout within the next 7 trading days.
high = 0.50
medium = 0.20
